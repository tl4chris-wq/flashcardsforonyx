<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theatre Vocabulary — Flash Cards</title>
<style>
:root{color-scheme:light;--ink:#172033;--muted:#647084;--paper:#f4f6fa;--panel:#fff;--line:#dce2eb;--accent:#3457d5;--accent2:#e9edff;--good:#16794b;--bad:#b54735}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:850px;margin:0 auto;padding:28px 18px 50px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:clamp(1.5rem,4vw,2.1rem);line-height:1.15;margin:0 0 6px}
.sub{color:var(--muted);margin:0}
.pill{border:1px solid var(--line);border-radius:999px;padding:6px 12px;background:var(--panel);font-size:.9rem;color:var(--muted)}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}
button,select{font:inherit;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent)}button:focus-visible,select:focus-visible{outline:3px solid #aab8ff;outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:white}.primary:hover{background:#2948b9;color:white}
.card{min-height:330px;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:30px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 12px 35px #1720330d;cursor:pointer;position:relative}
.card:focus-visible{outline:3px solid #aab8ff;outline-offset:3px}
.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:.75rem;font-weight:750;color:var(--muted);margin-bottom:18px}
.card h2{font-size:clamp(1.7rem,5vw,2.5rem);line-height:1.2;margin:0;max-width:690px}
.card p{font-size:clamp(1.05rem,2.7vw,1.35rem);max-width:700px;margin:0}
.hint{color:var(--muted);font-size:.9rem;margin-top:24px}
.progressline{height:8px;border-radius:99px;background:#e3e7ef;overflow:hidden;margin:16px 0 8px}
.progressline span{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font-size:.9rem;gap:12px}
.controls{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:20px 0}
.rating{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.rating button{min-width:145px}
.known{border-color:#9bd2b6;background:#effaf4;color:var(--good)}
.missed{border-color:#e6b2a8;background:#fff4f1;color:var(--bad)}
.settings{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}
.small{font-size:.88rem;color:var(--muted)}
@media(max-width:520px){main{padding:22px 14px 36px}.card{min-height:360px;padding:22px}.toolbar button{flex:1}}
</style>
</head>
<body>
<main>
<header>
  <div><h1>Theatre Vocabulary</h1><p class="sub">Flash-card practice · 54 terms</p></div>
  <span class="pill" id="score">Known 0 · Review 0</span>
</header>
<div class="toolbar">
  <select id="mode" aria-label="Card order">
    <option value="all">All cards</option>
    <option value="missed">Review missed</option>
    <option value="unseen">Not marked yet</option>
  </select>
  <button id="shuffle">Shuffle</button>
  <button id="restart">Restart set</button>
</div>
<div class="meta"><span id="counter">Card 1 of 54</span><span id="side">Term</span></div>
<div class="progressline"><span id="bar"></span></div>
<div class="card" id="card" role="button" tabindex="0" aria-label="Flash card. Press Enter or Space to flip.">
  <div class="eyebrow" id="label">Term</div>
  <h2 id="content">Action</h2>
  <div class="hint">Click card or press Space to reveal</div>
</div>
<div class="controls">
  <button id="prev">← Previous</button>
  <button class="primary" id="flip">Reveal answer</button>
  <button id="next">Next →</button>
</div>
<div class="rating">
  <button class="missed" id="again">× Need to review</button>
  <button class="known" id="know">✓ I know this</button>
</div>
<div class="settings">
  <span class="small">Keyboard: Space = flip · ←/→ = navigate · 1 = review · 2 = known</span>
  <span class="small" id="status" aria-live="polite">Choose a rating to track your progress.</span>
</div>
</main>
<script>
const cards = [{"term": "Action", "definition": "The core of a theatre piece; the sense of forward movement created by the sense of time and/or the physical and psychological motivations of characters."}, {"term": "Aesthetic Criteria", "definition": "Criteria developed about the visual, aural, and oral aspects of the witnessed event, derived from cultural and emotional values and cognitive meaning."}, {"term": "Aesthetic Qualities", "definition": "The emotional values and cognitive meanings derived from interpreting a work of art; the symbolic nature of art."}, {"term": "Antagonist", "definition": "One who struggles for mastery with another; an opponent in a contest of any kind."}, {"term": "Arena", "definition": "An open space at floor level in the middle of an auditorium."}, {"term": "Artistic Choices", "definition": "Selections made by theatre artists about situation, action, direction, and design in order to convey meaning."}, {"term": "Character", "definition": "The primary material from which plots are created; incidents are developed through speech and behavior of dramatic personages."}, {"term": "Classical", "definition": "A dramatic form and production techniques considered of significance in earlier times, in any culture or historical period."}, {"term": "Conflict", "definition": "The opposition of persons or forces that gives rise to the dramatic action in a drama or fiction."}, {"term": "Climax", "definition": "Highest point of tension before conclusion."}, {"term": "Constructed Meaning", "definition": "The personal understanding of dramatic/artistic intentions and actions and their social and personal significance, selected and organized from the aural, oral, and visual symbols of a dramatic production."}, {"term": "Crisis", "definition": "A crucial or decisive point or situation; a turning point in the action."}, {"term": "Denouement", "definition": "The outcome, a solution, unraveling or clarification of a plot in a drama."}, {"term": "Diction", "definition": "The playwright’s primary means of expression."}, {"term": "Drama", "definition": "The art of composing, writing, acting, or producing plays; a literary composition intended to portray life or character or to tell a story usually involving conflicts and emotions exhibited through action and dialogue, designed for theatrical performance."}, {"term": "Dramatic Media", "definition": "Means of telling stories by way of stage, film, television, radio, or computer discs."}, {"term": "Electronic Media", "definition": "Means of communication characterized by the use of technology."}, {"term": "Ensemble", "definition": "The dynamic interaction and harmonious blending of the efforts of the many artists involved in the dramatic activity of theatrical production."}, {"term": "Environment", "definition": "Physical surroundings that establish place, time, and atmosphere/mood; the physical conditions that reflect and affect the emotions, thoughts, and actions of characters."}, {"term": "Exposition", "definition": "The setting forth of information about earlier events, the identity and relationship of the characters, and the present situation."}, {"term": "Falling Action", "definition": "A downward direction or slope; that which falls or drops."}, {"term": "Flexible Space", "definition": "The areas used by audience and performer can be varied from one evening to the next or during the course of one evening."}, {"term": "Floor Plan", "definition": "All the elements of the setting and their arrangement."}, {"term": "Foreshadowing", "definition": "The act of indicating beforehand."}, {"term": "Formal Production", "definition": "The staging of a dramatic work for presentation for an audience."}, {"term": "Front of House", "definition": "Box office and lobby."}, {"term": "Genre", "definition": "A kind; relates to the kind of emotional response a play creates."}, {"term": "Improvisation", "definition": "The spontaneous use of movement and speech to create a character or object in a particular situation."}, {"term": "Inciting Incident", "definition": "An occurrence that sets the main action into motion."}, {"term": "Informal Production", "definition": "The exploration of all aspects of a dramatic work in a setting where experimentation is emphasized."}, {"term": "Melodrama", "definition": "A serious play that ends happily."}, {"term": "Motif", "definition": "Recurring structures, contrasts, or literary devices that can help to develop and inform the text’s major themes."}, {"term": "Music", "definition": "All patterned sound; it is an important ingredient in every production."}, {"term": "New Art Forms", "definition": "The novel combination of traditional arts and materials with emerging technology."}, {"term": "Point of Attack", "definition": "The place in the story where the playwright begins the plot."}, {"term": "Point of View", "definition": "Examination from a certain perspective."}, {"term": "Proscenium", "definition": "The front area of the stage that is still visible to the audience when the curtain is lowered."}, {"term": "Proscenium Arch", "definition": "A theatre box on either side of and nearest to the proscenium."}, {"term": "Protagonist", "definition": "The leading character or actor in a play, about whom the action centers."}, {"term": "Role", "definition": "The characteristic and expected social behavior of an individual in a given position."}, {"term": "Script", "definition": "The written dialogue, description, and directions provided by the playwright."}, {"term": "Symbol", "definition": "Objects, characters, figures, or colors used to represent abstract ideas or concepts."}, {"term": "Tense", "definition": "Any forms of a verb that show the time of its action or state of being."}, {"term": "Tension", "definition": "The atmosphere created by unresolved, disquieting, or inharmonious situations that human beings feel compelled to address."}, {"term": "Text", "definition": "The basis of dramatic activity and performance; a written script or an agreed-upon structure and content for an improvisation."}, {"term": "Theatre", "definition": "The imitation/representation of life, performed for other people."}, {"term": "Theatre Literacy", "definition": "The ability to create, perform, perceive, analyze, critique, and understand dramatic performances."}, {"term": "Theme", "definition": "The fundamental and often universal ideas explored in a literary work."}, {"term": "Thoughts", "definition": "Includes the themes, arguments and overall meaning of the action."}, {"term": "Thrust Stage", "definition": "The seats are usually arranged on three, or sometimes two, sides of a raised platform. The stage brings the audience and performers into a more intimate relationship, since a greater portion of the spectators are closer to the action."}, {"term": "Traditional Forms", "definition": "Forms that use time-honored theatrical practices."}, {"term": "Tragedy", "definition": "A play that is serious and ends unhappily. The protagonist in a tragedy frequently faces an ethical choice or a choice about a moral issue."}, {"term": "Tragicomedy", "definition": "When tragic and comic qualities are equally mixed."}, {"term": "Unified Production Concept", "definition": "A brief statement, metaphor, or expression of the essential meaning of a play that orders and patterns all the play’s parts."}];
let order = cards.map((_,i)=>i), index=0, flipped=false;
const ratings = new Map();
const $ = id => document.getElementById(id);
function activeOrder(){
  const mode=$('mode').value;
  if(mode==='missed') return order.filter(i=>ratings.get(i)==='missed');
  if(mode==='unseen') return order.filter(i=>!ratings.has(i));
  return order;
}
function render(){
  const list=activeOrder();
  if(index>=list.length) index=Math.max(0,list.length-1);
  const empty=!list.length;
  $('card').style.display=empty?'none':'flex';
  $('counter').textContent=empty?'No cards in this set':`Card ${index+1} of ${list.length}`;
  $('bar').style.width=empty?'0%':`${((index+1)/list.length)*100}%`;
  $('prev').disabled=empty||index===0;
  $('next').disabled=empty||index===list.length-1;
  $('flip').disabled=empty;
  $('again').disabled=empty;$('know').disabled=empty;
  if(empty){$('side').textContent='';$('status').textContent='Nothing to review in this filter.';updateScore();return;}
  const c=cards[list[index]];
  $('label').textContent=flipped?'Definition':'Term';
  $('side').textContent=flipped?'Definition':'Term';
  $('content').textContent=flipped?c.definition:c.term;
  $('card').setAttribute('aria-label',`${flipped?'Definition':'Term'}: ${flipped?c.definition:c.term}. Press Enter or Space to flip.`);
  $('flip').textContent=flipped?'Show term':'Reveal answer';
  const r=ratings.get(list[index]);
  $('status').textContent=r==='known'?'Marked as known.':r==='missed'?'Marked for review.':'Choose a rating to track your progress.';
  updateScore();
}
function updateScore(){
  let known=0,missed=0;
  for(const v of ratings.values()){if(v==='known')known++;else if(v==='missed')missed++;}
  $('score').textContent=`Known ${known} · Review ${missed}`;
}
function flip(){if(!activeOrder().length)return;flipped=!flipped;render();}
function move(n){const list=activeOrder();if(!list.length)return;index=Math.max(0,Math.min(list.length-1,index+n));flipped=false;render();}
function rate(value){
  const list=activeOrder();if(!list.length)return;
  ratings.set(list[index],value);
  const oldIndex=index;const newList=activeOrder();
  index=Math.min(oldIndex,Math.max(0,newList.length-1));flipped=false;render();
}
$('card').addEventListener('click',flip);
$('card').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();flip();}});
$('flip').onclick=flip;$('prev').onclick=()=>move(-1);$('next').onclick=()=>move(1);
$('again').onclick=()=>rate('missed');$('know').onclick=()=>rate('known');
$('mode').onchange=()=>{index=0;flipped=false;render();};
$('shuffle').onclick=()=>{for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}index=0;flipped=false;render();};
$('restart').onclick=()=>{index=0;flipped=false;$('mode').value='all';render();};
document.addEventListener('keydown',e=>{
  if(['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName))return;
  if(e.key===' '){e.preventDefault();flip();}
  else if(e.key==='ArrowRight')move(1);
  else if(e.key==='ArrowLeft')move(-1);
  else if(e.key==='1')rate('missed');
  else if(e.key==='2')rate('known');
});
render();
</script>
</body></html>
